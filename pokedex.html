<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OHR 펫 도감</title>
<meta name="description" content="오르서버 펫의 속성, 획득 방법, S급 성장률과 초기치를 한눈에 보는 도감">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="preload" href="pets.json" as="fetch" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="siteNav"></div>

<main class="shell">
  <div class="page-head">
    <h1 class="page-title">펫 도감</h1>
    <p class="page-sub">공홈 펫 정보를 바탕으로 S급 성장률과 초기치를 보여줘요</p>
  </div>
  <button class="btn ghost filter-toggle" id="filterToggle" type="button" aria-expanded="false">검색·필터 열기</button>
  <div class="dex-layout">
    <aside class="filters box" id="filters">
      <div class="f-title">검색</div>
      <input id="search" class="f-input" type="search" placeholder="펫 이름 / 획득처 (초성 가능)" autocomplete="off" aria-label="펫 검색">
      <div class="f-title">속성</div>
      <div class="f-seg" id="attrSeg"></div>
      <div class="f-title">속성값 필터 <small>최대 2속성 · 총합 10</small></div>
      <label class="sw-row"><input type="checkbox" id="attrMode"> 선택값 이상 검색</label>
      <div class="asl" id="attrSliders"></div>
      <div class="f-title">정렬</div>
      <select id="sortSel" class="f-input" aria-label="정렬">
        <option value="default">기본정렬</option>
        <option value="atk">공격 성장률 높은순</option>
        <option value="def">방어 성장률 높은순</option>
        <option value="agi">순발 성장률 높은순</option>
        <option value="hp">내구 성장률 높은순</option>
        <option value="total">총성장 높은순</option>
        <option value="name">이름순</option>
      </select>
      <div class="f-title">보기 방식</div>
      <div class="f-seg" id="viewSeg"></div>
      <div class="f-title">분류</div>
      <div class="chips" id="catChips"></div>
    </aside>

    <section class="dex-main">
      <div class="stats-row">
        <span class="pill"><b id="statTotal">-</b>전체 펫</span>
        <span class="pill"><b id="statShown">-</b>표시중</span>
        <span class="pill"><b id="statMount">-</b>탑승가능</span>
      </div>
      <div id="grid"></div>
      <div class="empty" id="empty" hidden>검색 결과가 없어요.</div>
      <button class="btn ghost" id="loadmore" type="button" hidden>더 보기</button>
    </section>
  </div>
  <p class="foot">
    공홈 펫정보 페이지의 값을 그대로 모아 보여주는 도감이에요. 오르 공식 사이트와는 관계없는 팬 도구예요.
  </p>
</main>

<div class="modal" id="modal" hidden>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="mName">
    <button class="mclose" id="mClose" type="button" aria-label="닫기">✕</button>
    <div id="mBody"></div>
  </div>
</div>
<script src="nav.js"></script>
<script src="common.js"></script>
<script src="dex.js"></script>
</body>
</html>
