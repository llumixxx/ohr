<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OHR Mate - 환각 계산기</title>
<meta name="description" content="오르서버 펫의 레벨 1 초기치로 가능한 등급과 +8 환각 확률을 계산해요">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="preload" href="pets.json" as="fetch" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="siteNav"></div>

<main class="shell">
  <div class="calc-layout">
    <aside class="petcard box" id="hero">
      <div class="pick">
        <input id="pick" type="search" placeholder="펫 이름 또는 초성으로 검색" autocomplete="off" aria-label="펫 검색">
        <div class="suggest" id="suggest" role="listbox" hidden></div>
      </div>
      <div class="pc-head">
        <div class="frame"><div class="frame-in"><span id="hImg" style="display:contents"></span></div></div>
        <div class="pc-info">
          <h1 class="pname" id="hName">불러오는 중…</h1>
          <div class="tags" id="hTags"></div>
          <div class="attrs" id="hAttrs"></div>
        </div>
      </div>
      <table class="stat-table">
        <thead><tr><th></th><th>성장률</th><th>순위</th><th>S급 초기치</th></tr></thead>
        <tbody id="hStats"></tbody>
      </table>
      <p class="fine" id="hRankNote"></p>
      <p class="hero-how" id="hHow"></p>
      <a class="btn ghost" id="dexLink" href="pokedex.html">도감에서 자세히 보기</a>
    </aside>

    <section class="calc box" id="calcPanel">
      <div class="box-h"><span class="ico">✨</span><h2>환각 계산</h2></div>
      <p class="lead">펫을 얻었을 때(레벨 1) 정보창에 보이는 초기치를 넣고 계산하기를 눌러주세요.</p>
      <div class="stat-grid" id="statGrid"></div>
      <div class="calc-row">
        <button class="btn" id="calcBtn" type="button">계산하기</button>
        <button class="btn ghost" id="resetBtn" type="button">S급 초기치로 되돌리기</button>
      </div>
      <div class="xmods" id="xmods"></div>
    </section>

    <section class="resbox box" id="resultPanel">
      <div class="box-h"><span class="ico b">📊</span><h2>결과</h2><span class="stale-note" id="staleNote" hidden>값이 바뀌었어요 · 계산하기를 눌러주세요</span></div>
      <div id="results"><div class="empty">펫 정보를 불러오는 중이에요…</div></div>
    </section>
  </div>
</main>
<script src="nav.js"></script>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
