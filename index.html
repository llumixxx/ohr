<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OHR 환각 계산기</title>
<meta name="description" content="오르서버 펫의 레벨 1 초기치로 가능한 등급과 +8 환각 확률을 계산해요">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav" aria-label="상단 메뉴">
  <div class="nav-in">
    <div class="brand"><b>OHR</b> 환각 계산기</div>
    <span class="grow"></span>
    <button class="theme" id="themeBtn" type="button">다크 모드</button>
  </div>
</nav>

<section class="hero" id="hero" aria-live="polite">
  <div class="ghost" id="ghost" aria-hidden="true"></div>
  <div class="hero-in">
    <div>
      <p class="hero-label">선택한 펫</p>
      <h1 id="hName">펫을 골라주세요</h1>
      <div class="vtabs" id="vTabs" role="tablist" aria-label="펫 형태"></div>
      <div class="tags" id="hTags"></div>
      <p class="hero-how" id="hHow"></p>
      <div class="attrs" id="hAttrs"></div>
    </div>
    <div class="stage" id="stage" title="좌우로 끌어서 돌려보세요">
      <div class="spot" aria-hidden="true"></div>
      <div class="plat" aria-hidden="true"><div class="disc"></div></div>
      <div class="pet" id="pet"><span id="hImg" style="display:contents"></span></div>
      <div class="hint">좌우로 끌어서 돌려보세요</div>
    </div>
  </div>
  <div class="specs" id="hSpecs"></div>
</section>

<main class="wrap">
  <section class="panel" id="calcPanel">
    <h2>레벨 1 초기치로 등급 계산</h2>
    <p class="lead">펫을 얻었을 때(레벨 1) 정보창에 보이는 초기치를 그대로 넣어주세요.</p>
    <div class="stat-grid" id="statGrid"></div>
    <div class="calc-row">
      <button class="calc-btn" id="calcBtn" type="button">등급 계산</button>
      <button class="ghost-btn" id="resetBtn" type="button">참고 초기치로 되돌리기</button>
    </div>
    <div id="results"></div>
  </section>

  <section id="listSec">
    <h2>전체 펫</h2>
    <div class="ctrl">
      <input class="search" id="search" type="search" placeholder="이름 또는 초성 검색" autocomplete="off" aria-label="펫 검색">
      <div class="chips" id="chips" role="group" aria-label="속성"></div>
      <div class="seg" id="modes" role="group" aria-label="보기">
        <button type="button" class="segb" data-mode="all" aria-pressed="true">전체</button>
        <button type="button" class="segb" data-mode="ride" aria-pressed="false">탑승 가능</button>
        <button type="button" class="segb" data-mode="fav" aria-pressed="false">즐겨찾기</button>
      </div>
      <div class="seg" id="sorts" role="group" aria-label="정렬">
        <button type="button" class="segb" data-sort="total" aria-pressed="false">총성장</button>
        <button type="button" class="segb" data-sort="0" aria-pressed="false">내구</button>
        <button type="button" class="segb" data-sort="1" aria-pressed="false">공격</button>
        <button type="button" class="segb" data-sort="2" aria-pressed="false">방어</button>
        <button type="button" class="segb" data-sort="3" aria-pressed="false">순발</button>
      </div>
      <span class="cnt" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <p class="foot">
    레벨 1 초기치에서 가능한 등급 보정(−2~+2)과 보너스 분배 10포인트의 모든 경우(178,750가지)를 대조해서 등급 확률을 구해요. 확률은 가능한 조합을 모두 같은 비율로 보고 계산해요.
    서버 소스를 직접 볼 수 없어서 계산에 쓰는 원본계수는 표기 성장률로 거꾸로 맞춘 값이고, 실제와 다를 수 있어요.
  </p>
</main>
<script src="app.js"></script>
</body>
</html>
