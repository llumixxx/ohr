<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OHR Mate - 탑승효율</title>
<meta name="description" content="내 캐릭터 기본치와 포인트에 맞춰 어떤 펫을 타면 가장 효율이 좋은지 보여줘요">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="preload" href="pets.json" as="fetch" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ride.css">
</head>
<body>
<div id="siteNav"></div>

<main class="shell">
  <div class="page-head">
    <h1 class="page-title">탑승효율</h1>
    <p class="page-sub" id="rdSub"></p>
  </div>
  <div class="f-seg rd-tabs" id="rdTabs"></div>
  <div class="ride-layout">
    <aside class="box rd-ctl" id="rdCtl">
      <section data-t="rank">
        <div class="f-title">내 기본치 <small>BASE STATUS</small></div>
        <div class="rd-grid" id="rdBase"></div>
      </section>
      <section data-t="plan goal">
        <div class="f-title">총 포인트 <small>완력·건강·스피드에 나눌 합계</small></div>
        <div id="rdPtBox"></div>
      </section>
      <section data-t="rank plan goal">
        <div class="f-title">펫 레벨</div>
        <div id="rdLvBox"></div>
      </section>
      <section data-t="rank">
        <div class="f-title">정렬 기준</div>
        <div class="f-seg" id="rdSort"></div>
      </section>
      <section data-t="plan">
        <div class="f-title">우선순위 <small>남는 포인트를 어디에 쓸지</small></div>
        <div class="f-seg" id="rdPrio"></div>
      </section>
      <section data-t="plan">
        <div class="f-title">최소 보장 <small>탑승 중 이 이상, 0이면 없음</small></div>
        <div class="rd-grid" id="rdMinBox"></div>
      </section>
      <section data-t="goal">
        <div class="f-title">목표 능력치 <small>탑승 중 이 수치까지</small></div>
        <div class="rd-grid" id="rdGoalBox"></div>
      </section>
      <section data-t="plan goal">
        <div class="f-title">장비 보너스 <small>장비로 오른 수치, 모르면 0</small></div>
        <div class="rd-grid" id="rdEquipBox"></div>
      </section>
      <section data-t="rank plan goal">
        <label class="sw-row"><input type="checkbox" id="rdReborn"><span class="sw-track"><span class="sw-thumb"></span></span><span class="sw-text">환생·진화 펫도 보기</span></label>
        <p class="fine" id="rdHelp"></p>
      </section>
    </aside>

    <section class="box rd-main">
      <div class="box-h"><span class="ico b">🚀</span><h2 id="rdTitle">탑승 가능 펫</h2><span class="stale-note" id="rdWarn" hidden></span></div>
      <div class="rd-list" id="rdList"><div class="empty">펫 정보를 불러오는 중이에요…</div></div>
    </section>
  </div>
</main>
<script src="nav.js"></script>
<script src="common.js"></script>
<script src="ride.js"></script>
</body>
</html>
